<text x="64" y="77" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="42">Bản đồ dữ liệu theo phạm vi</text>
<text x="64" y="122" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="22">Mô hình logic đề xuất; chưa chốt cơ sở dữ liệu hoặc thuật toán mã hóa.</text>
<polyline points="580,280.0 635.0,280.0 635.0,280.0 690,280.0" fill="none" stroke="#5c726d" stroke-width="4" marker-end="url(#a)"/>
