<text x="819.5" y="795.0" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="22">Xuất theo lựa chọn</text>
<rect x="80" y="200" width="500" height="160" rx="12" fill="white" stroke="#b8cdc6" stroke-width="2"/>
<text x="102" y="244" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="30">Theo máy / ứng dụng</text>
<text x="102" y="282" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">Quyền chung, startup, chọn trình duyệt và</text>
<text x="102" y="314" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">màn hình.</text>
<rect x="690" y="200" width="1030" height="160" rx="12" fill="white" stroke="#b8cdc6" stroke-width="2"/>
<text x="712" y="244" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="30">Theo từng hồ sơ</text>
<text x="712" y="282" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">Một hồ sơ hoạt động. Hồ sơ khác đóng băng hoàn toàn.</text>
<rect x="690" y="540" width="440" height="170" rx="12" fill="white" stroke="#b8cdc6" stroke-width="2"/>
<text x="712" y="584" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="30">Đời sống / quan hệ</text>
<text x="712" y="622" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">Nhu cầu, tâm trạng, tính cách, ký ức</text>
<text x="712" y="654" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">và sở thích.</text>
<rect x="1300" y="540" width="420" height="170" rx="12" fill="white" stroke="#b8cdc6" stroke-width="2"/>
<text x="1322" y="584" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="30">Bài học / đồ vật</text>
<text x="1322" y="622" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">Reset hồ sơ xóa bài học; queue</text>
<text x="1322" y="654" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">chưa xong không tự chạy lại.</text>
<rect x="80" y="900" width="500" height="170" rx="12" fill="white" stroke="#b8cdc6" stroke-width="2"/>
<text x="102" y="944" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="30">Lịch sử thao tác</text>
<text x="102" y="982" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">Riêng với ký ức; giữ 30 ngày, không</text>
<text x="102" y="1014" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">ảnh/chữ riêng tư.</text>
<rect x="690" y="900" width="440" height="170" rx="12" fill="white" stroke="#b8cdc6" stroke-width="2"/>
<text x="712" y="944" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="30">Bản xuất thủ công</text>
<text x="712" y="982" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">Mật khẩu và mã khôi phục. Không</text>
<text x="712" y="1014" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">quyền hiệu lực hoặc khóa AI.</text>
<rect x="1300" y="900" width="420" height="170" rx="12" fill="white" stroke="#b8cdc6" stroke-width="2"/>
<text x="1322" y="944" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="30">Khóa AI trên máy</text>
<text x="1322" y="982" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">Không đưa vào bản sao lưu. Máy</text>
<text x="1322" y="1014" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="24">mới phải kết nối lại.</text>
<text x="64" y="1210" fill="#202b38" font-family="Segoe UI, sans-serif" font-size="22">2026-11-13 · Bản thiết kế để rà; các phần chưa thử không được coi là đã hoạt động.</text>
